apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  namespace: vcenter-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
          ports:
            - containerPort: 10051
          envFrom:
            - secretRef:
                name: zabbix-db
          env:
            - name: DB_SERVER_HOST
              value: zabbix-db
            - name: ZBX_STARTVMWARECOLLECTORS
              value: "10"
            - name: ZBX_VMWARECACHESIZE
              value: "64M"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  namespace: vcenter-monitoring
spec:
  selector:
    app: zabbix-server
  ports:
    - name: trapper
      port: 10051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  namespace: vcenter-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: zabbix-db
          env:
            - name: DB_SERVER_HOST
              value: zabbix-db
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: PHP_TZ
              value: Asia/Tashkent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  namespace: vcenter-monitoring
spec:
  selector:
    app: zabbix-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zabbix-web
  namespace: vcenter-monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: zabbix.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zabbix-web
                port:
                  number: 80
